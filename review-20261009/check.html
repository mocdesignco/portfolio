<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio responsive review</title><style>body{margin:0;font:16px Arial;background:#ddd}header{padding:16px;display:flex;gap:24px;align-items:center;background:#fff}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px}iframe{display:block;border:0;height:820px;background:white;margin:24px auto}main{overflow:auto}</style></head><body><header><label>Page<select id="page"><option value="riley.">Riley</option><option value="ashen-cloud">Ashen & Cloud</option><option value="veup-company-os">Company OS</option><option value="veup-creative-ops">Creative operations</option><option value="veup-ai-creative-system">AI system</option><option value="selected-visual-work">Visual work</option><option value="home">Homepage</option></select></label><label>Preview width<select id="width"><option>390</option><option>360</option><option>768</option><option>1024</option><option>1440</option></select></label></header><main><iframe title="Portfolio page preview" id="preview" width="390" src="https://mocdesignco.github.io/portfolio/riley./?v=site-4"></iframe></main><script>function update(){const p=document.getElementById('page').value,w=document.getElementById('width').value;const f=document.getElementById('preview');f.width=w;f.src='https://mocdesignco.github.io/portfolio/'+(p==='home'?'':p+'/')+'?v=site-4';}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',update));</script></body></html>
